<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #e0e7ff,
                #fce7f3
            );
        }

        .calculator {
            width: 400px;
            padding: 35px;
            border-radius: 25px;

            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        .title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: white;
            transition: 0.3s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;

            background: #6366f1;
            color: white;

            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        .output-box {
            margin-top: 25px;
            padding: 18px;

            background: #f8fafc;
            border-radius: 15px;

            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .output-title {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        #output {
            font-size: 28px;
            font-weight: bold;
            color: #4f46e5;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1 class="title">Simple Calculator</h1>

        <p class="subtitle">
            Hitung dua bilangan dengan mudah ✨
        </p>

        <div class="input-group">
            <label for="bilangan1">Bilangan 1</label>
            <input 
                type="number" 
                id="bilangan1" 
                placeholder="Masukkan bilangan pertama"
            >
        </div>

        <div class="input-group">
            <label for="bilangan2">Bilangan 2</label>
            <input 
                type="number" 
                id="bilangan2" 
                placeholder="Masukkan bilangan kedua"
            >
        </div>

        <div class="buttons">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">−</button>
            <button onclick="hitung('*')">×</button>
            <button onclick="hitung('/')">÷</button>
        </div>

        <div class="output-box">
            <div class="output-title">HASIL PERHITUNGAN</div>
            <div id="output">0</div>
        </div>

        <div class="footer">
            JavaScript Arithmetic Calculator
        </div>

    </div>


    <script>

        function hitung(operator) {

            let bilangan1 = parseFloat(
                document.getElementById("bilangan1").value
            );

            let bilangan2 = parseFloat(
                document.getElementById("bilangan2").value
            );

            let hasil;

            if (isNaN(bilangan1) || isNaN(bilangan2)) {

                document.getElementById("output").innerHTML = "⚠️";

                return;
            }

            if (operator === "+") {
                hasil = bilangan1 + bilangan2;
            }

            else if (operator === "-") {
                hasil = bilangan1 - bilangan2;
            }

            else if (operator === "*") {
                hasil = bilangan1 * bilangan2;
            }

            else if (operator === "/") {

                if (bilangan2 === 0) {
                    document.getElementById("output").innerHTML = "Error";
                    return;
                }

                hasil = bilangan1 / bilangan2;
            }

            document.getElementById("output").innerHTML = hasil;
        }

    </script>

</body>
</html>
